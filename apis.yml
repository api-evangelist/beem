name: Beem
description: >-
  Beem is a consumer fintech mobile app (trybeem.com) offering instant cash
  advances of up to $1,000 through its Everdraft feature with no credit check
  and no interest, alongside personal loans up to $100,000, high-yield savings
  accounts paying up to 5% APY, AI-powered budgeting, credit building, cashback
  rewards, identity-theft protection, and insurance products. It supports
  non-traditional income (gig, freelance, government benefits) and can transfer
  funds to Cash App or a bank account. Backed by Techstars and used by more than
  five million people, Beem is consumer-facing and does not publish a public
  developer API, SDK, or developer portal at this time. Added to the API
  Evangelist network as a company profile.
